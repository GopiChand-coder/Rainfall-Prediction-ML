<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rainfall Prediction Result</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Inter',sans-serif;
    min-height:100vh;
    background:url("../static/images/rain-chance.jpg") center/cover no-repeat;
    display:flex;
    align-items:center;
    justify-content:center;
}

.container{
    text-align:center;
    max-width:480px;
}

h1{
    font-size:34px;
    color:white;
    margin-bottom:18px;
    font-weight:700;
    text-shadow:0 2px 8px rgba(0,0,0,0.4);
}

.message{
    font-size:18px;
    color:white;
    margin-bottom:18px;
    text-shadow:0 2px 8px rgba(0,0,0,0.4);
}

.confidence{
    font-size:20px;
    font-weight:600;
    color:white;
    margin-bottom:28px;
    text-shadow:0 2px 8px rgba(0,0,0,0.4);
}

a{
    display:inline-block;
    padding:12px 28px;
    background:#1E8E79;
    color:white;
    text-decoration:none;
    border-radius:10px;
    font-weight:600;
    transition:all 0.25s ease;
}

a:hover{
    background:#146B5E;
    transform:translateY(-2px);
    box-shadow:0 6px 14px rgba(30,142,121,0.25);
}

</style>
</head>

<body>

<div class="container">
    <h1>🌧️ Rain Expected!</h1>

    <p class="message">
        Chances of rain today — please carry an umbrella!
    </p>

    <p class="confidence">
        Confidence: {{ "%.1f"|format(confidence) }}%
    </p>

    <a href="/">← Make Another Prediction</a>
</div>

</body>
</html>
